<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="470" fill="#fff"/><rect x="20" y="15" width="330" height="52" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="36" y="41.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">1  在 Map 上找到負責的服務</text><text x="372" y="41.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">照資源類型分類，先找分類再找服務</text><line x1="185" y1="69" x2="185" y2="89" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="20" y="91" width="330" height="52" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="36" y="117.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">2  確認 Kolla-Ansible 能部署它</text><text x="372" y="117.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">這一版有沒有 enable_&lt;服務&gt; 開關</text><line x1="185" y1="145" x2="185" y2="165" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="20" y="167" width="330" height="52" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="36" y="193.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">3  準備 Kolla 不會替你做的前置</text><text x="372" y="193.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">例如 Day 3 的 LVM volume group</text><line x1="185" y1="221" x2="185" y2="241" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="20" y="243" width="330" height="52" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="36" y="269.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">4  在 globals.yml 打開開關</text><text x="372" y="269.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">先看它會不會連帶打開子服務</text><line x1="185" y1="297" x2="185" y2="317" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="20" y="319" width="330" height="52" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="36" y="345.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">5  重跑 kolla-ansible deploy</text><text x="372" y="345.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">冪等：只新增或改動需要的容器</text><line x1="185" y1="373" x2="185" y2="393" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="20" y="395" width="330" height="52" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="36" y="421.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">6  驗證</text><text x="372" y="421.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">服務出現在清單裡，再實際操作一次</text></svg>