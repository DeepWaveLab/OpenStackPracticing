ddle" font-weight="normal" fill="#222">確認通知回應與認證，不只看告警狀態</text><line x1="380" y1="300" x2="380" y2="322" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="70" y="325" width="620" height="64" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="380" y="347.0" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Heat AutoScalingGroup</text><text x="380" y="370.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">查 stack event 與 VM 數量；新增 VM 影響後續平均值</text><text x="380" y="450.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">一次成功不保證穩定；額度、容量、冷卻與資料生命週期仍須驗證</text></svg>