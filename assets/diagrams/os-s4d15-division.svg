<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="420" fill="#fff"/><ellipse cx="360" cy="50" rx="150" ry="28" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="360" y="50.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">使用者(openstack CLI / Swift)</text><rect x="40" y="170" width="250" height="70" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="165" y="205.0" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Keystone</text><rect x="430" y="170" width="250" height="70" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="555" y="195.0" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">RGW daemon</text><text x="555" y="220.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">聽 7480,同時接 S3 與 Swift</text><line x1="290" y1="68" x2="180" y2="168" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="196" y="112.0" font-size="13" text-anchor="end" dominant-baseline="middle" font-weight="normal" fill="#222">① 拿 token</text><line x1="430" y1="68" x2="540" y2="168" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="524" y="112.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">② 帶 token 存取</text><line x1="428" y1="205" x2="292" y2="205" stroke="#222" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="360" y="192.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">③ 驗 token</text><rect x="40" y="270" width="250" height="120" rx="0" fill="#fafafa" stroke="#222" stroke-width="1.4" stroke-dasharray="6 4"/><text x="165" y="292.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Kolla 負責(步驟 2)</text><text x="58" y="325.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">建 service user ceph_rgw</text><text x="58" y="350.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">註冊 object-store endpoint</text><line x1="165" y1="268" x2="165" y2="242" stroke="#222" stroke-width="1.4" stroke-dasharray="3 3"/><rect x="430" y="270" width="250" height="120" rx="0" fill="#fafafa" stroke="#222" stroke-width="1.4" stroke-dasharray="6 4"/><text x="555" y="292.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">cephadm 負責(步驟 1、3)</text><text x="448" y="325.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">起 RGW daemon</text><text x="448" y="350.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">告訴 RGW 去哪個 Keystone、</text><text x="448" y="372.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">用哪個帳號驗 token</text><line x1="555" y1="268" x2="555" y2="242" stroke="#222" stroke-width="1.4" stroke-dasharray="3 3"/></svg>