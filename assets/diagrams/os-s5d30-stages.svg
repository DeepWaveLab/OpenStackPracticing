<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 465" width="760" height="465" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="760" height="465" fill="#fff"/><text x="380" y="25.0" font-size="17" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">零費用要先定位在哪個階段</text><rect x="70" y="55" width="620" height="64" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="380" y="77.0" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Keystone fetcher</text><text x="380" y="100.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">依 rating 角色選出需要處理的專案</text><line x1="380" y1="120" x2="380" y2="142" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="70" y="145" width="620" height="64" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="380" y="167.0" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Prometheus collector</text><text x="380" y="190.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">依 project、resource 與週期取得並轉換用量</text><line x1="380" y1="210" x2="380" y2="232" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="70" y="235" width="620" height="64" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="380" y="257.0" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Hashmap rating module</text><text x="380" y="280.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">alt_name 對上 service，再依 mapping 套費率</text><line x1="380" y1="300" x2="380" y2="322" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="70" y="325" width="620" height="64" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="380" y="347.0" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">OpenSearch storage</text><text x="380" y="370.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">保存結果；API 與 Horizon 查相同範圍</text><text x="380" y="450.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">每段都可能回空；容器健康不能代替資料與範圍檢查</text></svg>