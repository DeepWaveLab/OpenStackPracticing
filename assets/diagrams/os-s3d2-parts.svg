nt-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">server create</text><text x="360.0" y="439.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">VM 開機，拿到內網 IP</text><line x1="472" y1="427" x2="528" y2="427" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="530" y="400" width="170" height="54" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="615.0" y="417.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">floating IP</text><text x="615.0" y="439.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">外面才連得到</text></svg>