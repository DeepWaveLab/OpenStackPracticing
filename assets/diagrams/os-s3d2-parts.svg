<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="480" fill="#fff"/><rect x="20" y="20" width="310" height="330" rx="0" fill="#fff" stroke="#222" stroke-width="1.4" stroke-dasharray="7 5"/><text x="175" y="44.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">管理員建立，所有租戶共用</text><rect x="45" y="70" width="260" height="54" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="175.0" y="87.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">image</text><text x="175.0" y="109.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">VM 的開機碟</text><rect x="45" y="138" width="260" height="54" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="175.0" y="155.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">flavor</text><text x="175.0" y="177.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">規格：CPU、記憶體、磁碟</text><rect x="45" y="206" width="260" height="54" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="175.0" y="223.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">ext-net</text><text x="175.0" y="245.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">對外網路，floating IP 從這裡分</text><rect x="390" y="20" width="310" height="330" rx="0" fill="#fff" stroke="#222"