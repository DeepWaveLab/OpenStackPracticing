e="#aaa" stroke-width="1.4" stroke-dasharray="5 4"/><text x="552" y="192.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#999">……</text><rect x="606" y="170" width="84" height="44" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="648" y="192.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">skyline</text><text x="30" y="234.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">只跑 skyline 的部署步驟,虛線框的服務整段略過。</text><text x="30" y="280.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">反過來說:之後別的服務加進來,Skyline 的設定不會自己更新,要再跑一次 --tags skyline。</text></svg>