<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" width="760" height="375" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="760" height="375" fill="#fff"/><text x="380" y="25.0" font-size="17" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">VM 刪除後仍可能取得新樣本</text><rect x="70" y="55" width="620" height="64" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="380" y="77.0" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">VM 已刪除</text><text x="380" y="100.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">來源不再更新該 VM 的讀數</text><line x1="380" y1="120" x2="380" y2="142" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="70" y="145" width="620" height="64" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="380" y="167.0" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Pushgateway 仍保留最後值</text><text x="380" y="190.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">未同步刪除 grouping key 就仍會曝露</text><line x1="380" y1="210" x2="380" y2="232" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="70" y="235" width="620" height="64" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="380" y="257.0" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Prometheus 繼續 scrape</text><text x="380" y="280.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">每次讀取形成新時間戳樣本，時間窗口仍可查到</text><text x="380" y="360.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">max_over_time 的窗口不能代替資源生命週期同步</text></svg>