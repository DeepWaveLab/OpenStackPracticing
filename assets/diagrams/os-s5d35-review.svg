<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="840" height="260" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="840" height="260" fill="#fff"/><text x="420" y="28.0" font-size="16" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">共用雲的使用與維運</text><rect x="30.0" y="75" width="172.5" height="100" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="116.25" y="115.9" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">租戶、角色、額度</text><text x="116.25" y="134.1" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">Day 27</text><line x1="204.5" y1="125" x2="230.5" y2="125" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="232.5" y="75" width="172.5" height="100" rx="0" fill="#d4d4d4" stroke="#f0a020" stroke-width="1.4"/><text x="318.75" y="115.9" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">用量、擴縮、費率</text><text x="318.75" y="134.1" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">Day 28–30</text><line x1="407.0" y1="125" x2="433.0" y2="125" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="435.0" y="75" width="172.5" height="100" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="521.25" y="115.9" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">復原、入口 TLS</text><text x="521.25" y="134.1" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill