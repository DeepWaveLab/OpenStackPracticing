<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="260" fill="#fff"/><text x="360" y="28.0" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">從新增容量到主機維護</text><rect x="30.0" y="80" width="142.5" height="90" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="101.25" y="116.55" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">準備新 compute</text><text x="101.25" y="133.45" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">網路、CPU、磁碟</text><line x1="174.5" y1="125" x2="200.5" y2="125" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="202.5" y="80" width="142.5" height="90" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="273.75" y="116.55" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">部署與確認</text><text x="273.75" y="133.45" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">Nova、Placement</text><line x1="347.0" y1="125" x2="373.0" y2="125" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="375.0" y="80" width="142.5" height="90" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="446.25" y="116.55" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">遷移 VM</text><text x="446.25" y="133.45" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">驗證落點與應用</text><line x1="519.5" y1="125" x2="545.5" y2="125" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="547.5" y="80" width="142.5" height="90" rx="0" fill="#d4d4d4" stroke="#f0a020" stroke-width="1.4"/><text x="618.75" y="116.55" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">舊主機維護</text><text x="618.75" y="133.45" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">先 disable 再清空</text><text x="360" y="215.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">新主機出現不會自動搬移既有 VM；清空要涵蓋所有租戶。</text></svg>