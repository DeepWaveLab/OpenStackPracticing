ormal" fill="#222">符合條件則繼續；超額則拒絕請求</text><text x="380" y="360.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">Keystone 儲存額度；Nova 執行限制</text></svg>