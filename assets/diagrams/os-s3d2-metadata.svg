<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="470" fill="#fff"/><text x="175" y="30.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">cirros：metadata service</text><ellipse cx="175" cy="78" rx="80" ry="22" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="175" y="78.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">VM（cirros）</text><line x1="175" y1="102" x2="175" y2="146" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="187" y="124.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">HTTP 169.254.169.254</text><rect x="45" y="148" width="260" height="54" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="175.0" y="165.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">haproxy</text><text x="175.0" y="187.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">主機上的 ovnmeta-&lt;網路 ID&gt; namespace</text><line x1="175" y1="204" x2="175" y2="238" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="187" y="221.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">unix socket</text><rect x="45" y="240" width="260" height="48" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="175.0" y="264.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">neutron-ovn-metadata-agent</text><line x1="175" y1="290" x2="175" y2="324" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="187" y="307.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">附上 shared secret</text><rect x="45" y="326" width="260" height="48" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="175.0" y="350.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Nova metadata API</text><text x="175" y="404.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">OVN 要先把這條路設好，</text><text x="175" y="426.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">VM 送出請求時才拿得到公鑰</text><line x1="360" y1="20" x2="360" y2="440" stroke="#222" stroke-width="1.2" stroke-dasharray="6 5"/><text x="545" y="30.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Ubuntu：--config-drive True</text><rect x="415" y="60" width="260" height="84" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="545" y="84.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">config drive</text><text x="545" y="108.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">Nova 把公鑰等資料打包成</text><text x="545" y="128.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">一顆唯讀磁碟</text><line x1="545" y1="146" x2="545" y2="206" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="557" y="171.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">開機前就掛上</text><ellipse cx="545" cy="232" rx="110" ry="24" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="545" y="232.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">VM（Ubuntu）</text><text x="545" y="290.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">cloud-init 直接讀這顆磁碟，</text><text x="545" y="312.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">不經過網路，不用等 OVN</text></svg>