<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="270" fill="#fff"/><rect x="20" y="100" width="70" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="55.0" y="122.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">版本</text><text x="55.0" y="142.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">1 byte</text><rect x="90" y="100" width="120" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="150.0" y="122.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">時間戳</text><text x="150.0" y="142.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">8 bytes</text><rect x="210" y="100" width="130" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="275.0" y="122.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">IV</text><text x="275.0" y="142.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">16 bytes</text><rect x="340" y="100" width="230" height="60" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="455.0" y="122.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">密文</text><text x="455.0" y="142.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">長度不定</text><rect x="570" y="100" width="130" height="60" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="635.0" y="122.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">HMAC</text><text x="635.0" y="142.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">32 bytes</text><line x1="20" y1="70" x2="340" y2="70" stroke="#222" stroke-width="1.4"/><line x1="20" y1="64" x2="20" y2="76" stroke="#222" stroke-width="1.4"/><line x1="340" y1="64" x2="340" y2="76" stroke="#222" stroke-width="1.4"/><text x="180" y="48.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">base64 解碼後就讀得到</text><line x1="340" y1="70" x2="570" y2="70" stroke="#f0a020" stroke-width="1.8"/><line x1="570" y1="64" x2="570" y2="76" stroke="#f0a020" stroke-width="1.8"/><text x="455" y="48.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#b26a00">用金鑰解密</text><text x="635" y="48.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">用金鑰驗證</text><text x="455" y="180.2" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#333">解開後是使用者、專案、</text><text x="455" y="195.79999999999998" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#333">認證方式、到期時間</text><text x="635" y="180.2" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#333">確認 token</text><text x="635" y="195.79999999999998" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#333">沒被改過</text><text x="55" y="182.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#333">0x80</text><text x="20" y="245.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">整串再用 base64url 編碼,就是 CLI 拿到、以 gAAAAA 開頭的那串字