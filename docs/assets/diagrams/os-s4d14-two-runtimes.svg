<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="360" fill="#fff"/><rect x="10" y="10" width="700" height="340" rx="0" fill="#fff" stroke="#222" stroke-width="1.4" stroke-dasharray="6 4"/><text x="30" y="30.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">同一台 VM</text><text x="185" y="62.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Kolla-Ansible 部署</text><text x="535" y="62.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">cephadm 部署</text><rect x="55" y="90" width="260" height="50" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="185" y="115.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">docker daemon(常駐程式)</text><ellipse cx="85" cy="210" rx="44" ry="22" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="85" y="210.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">keystone</text><line x1="185" y1="142" x2="85" y2="186" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><ellipse cx="180" cy="210" rx="44" ry="22" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="180" y="210.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">nova_api</text><line x1="185" y1="142" x2="180" y2="186" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><ellipse cx="275" cy="210" rx="44" ry="22" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="275" y="210.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">mariadb</text><line x1="185" y1="142" x2="275" y2="186" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="185" y="262.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">所有容器都由 docker daemon 管,</text><text x="185" y="284.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">docker daemon 重啟時,這一邊一起重啟</text><rect x="405" y="90" width="260" height="50" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="535" y="115.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">systemd(主機本來就有)</text><ellipse cx="435" cy="210" rx="44" ry="22" fill="#fff7e6" stroke="#f0a020" stroke-width="1.4"/><text x="435" y="210.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">ceph-mon</text><line x1="535" y1="142" x2="435" y2="186" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><ellipse cx="530" cy="210" rx="44" ry="22" fill="#fff7e6" stroke="#f0a020" stroke-width="1.4"/><text x="530" y="210.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">ceph-mgr</text><line x1="535" y1="142" x2="530" y2="186" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><ellipse cx="625" cy="210" rx="44" ry="22" fill="#fff7e6" stroke="#f0a020" stroke-width="1.4"/><text x="625" y="210.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">ceph-osd</text><line x1="535" y1="142" x2="625" y2="186" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="535" y="262.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">每個背景程式是一個 systemd 服務,</text><text x="535" y="284.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">用 podman 跑容器,不經過 docker</text><line x1="360" y1="80" x2="360" y2="320" stroke="#222" stroke-width="1.2" stroke-dasharray="7 6"/></svg>