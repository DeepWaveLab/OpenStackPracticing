<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="320" fill="#fff"/><rect x="20" y="108" width="160" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="100" y="128.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">你的電腦</text><text x="100" y="150.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">你的公網 IP</text><rect x="20" y="212" width="160" height="50" rx="0" fill="#fafafa" stroke="#222" stroke-width="1.4"/><text x="100" y="237.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">其他 IP</text><rect x="250" y="96" width="170" height="84" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="335" y="118.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">NSG</text><text x="335" y="146.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">只放行:</text><text x="335" y="164.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">你的 IP → port 22</text><line x1="182" y1="138" x2="248" y2="138" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="182" y1="237" x2="300" y2="183" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="310" y="204.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#c0392b">在這裡擋掉</text><rect x="470" y="24" width="236" height="254" rx="0" fill="#fff" stroke="#222" stroke-width="1.4" stroke-dasharray="7 5"/><text x="486" y="44.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">Azure VM</text><rect x="490" y="62" width="196" height="40" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="588" y="82.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">SSH(port 22)</text><line x1="422" y1="126" x2="488" y2="90" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="490" y="142" width="196" height="120" rx="0" fill="#fafafa" stroke="#222" stroke-width="1.4" stroke-dasharray="4 4"/><text x="588" y="160.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">只在這台 VM 內部可達</text><ellipse cx="588" cy="194" rx="82" ry="16" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="588" y="194.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">OpenStack API、Horizon</text><ellipse cx="588" cy="236" rx="82" ry="16" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="588" y="236.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">雲裡開出的 VM</text><line x1="588" y1="104" x2="588" y2="140" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="596" y="122.0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">SSH tunnel</text><text x="360" y="300.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#333">Azure 虛擬網路不轉送廣播,外面連不進 lab 內部,floating IP 只在這台 VM 內部有效;要看裡面的東西,一律經過 SSH</text></svg>