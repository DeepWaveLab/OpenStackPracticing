nant-baseline="middle" font-weight="normal" fill="#222">接收推送並保存目前的序列值</text><line x1="380" y1="300" x2="380" y2="322" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="70" y="325" width="620" height="64" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="380" y="347.0" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Prometheus :9091</text><text x="380" y="370.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">定期 scrape；供告警與費用計算查詢</text><text x="380" y="450.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">target 為 up 不代表每個資源的讀數仍持續更新</text></svg>