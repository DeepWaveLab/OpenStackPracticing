<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="410" fill="#fff"/><rect x="25" y="20" width="150" height="40" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="100" y="40.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">nova-api</text><line x1="100" y1="62" x2="100" y2="330" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/><rect x="205" y="20" width="150" height="40" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="280" y="40.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">nova-conductor</text><line x1="280" y1="62" x2="280" y2="330" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/><rect x="385" y="20" width="150" height="40" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="460" y="40.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">nova-scheduler</text><line x1="460" y1="62" x2="460" y2="330" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/><rect x="555" y="20" width="150" height="40" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="630" y="40.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">nova-compute</text><line x1="630" y1="62" x2="630" y2="330" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/><line x1="100" y1="120" x2="278" y2="120" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="189.0" y="94.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">1. 建立 VM</text><text x="189.0" y="110.0" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">conductor 佇列</text><text x="92" y="152.0" font-size="12" text-anchor="end" dominant-baseline="middle" font-weight="normal" fill="#555">立刻回 CLI:</text><text x="92" y="170.0" font-size="12" text-anchor="end" dominant-baseline="middle" font-weight="normal" fill="#555">202,BUILD</text><line x1="280" y1="190" x2="458" y2="190" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="369.0" y="164.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">2. 放哪台主機?</text><text x="369.0" y="180.0" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">scheduler 佇列</text><line x1="460" y1="250" x2="282" y2="250" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="371.0" y="224.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">3. 回覆選定的主機</text><text x="371.0" y="240.0" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">conductor 的回覆佇列</text><line x1="280" y1="315" x2="628" y2="315" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="454.0" y="289.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">4. 在這台主機上開機</text><text x="454.0" y="305.0" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">compute.&lt;主機名&gt; 佇列</text><text x="20" y="365.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">每一則訊息都先送進 RabbitMQ 裡收件者的佇列,收件者再從佇列取出處理。</text><text x="20" y="390.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">1 和 4 送出後不等回覆;2 送出後,conductor 等 scheduler 回覆 3 才往下做。</text></svg>