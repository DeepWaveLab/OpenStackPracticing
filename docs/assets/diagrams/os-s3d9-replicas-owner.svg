<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="470" fill="#fff"/><text x="20" y="24.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">topology 裡寫著 replicas: 1</text><rect x="20" y="54" width="180" height="64" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="110" y="76.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Cluster topology</text><text x="110" y="98.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">ng-app replicas: 1</text><rect x="275" y="54" width="170" height="64" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="360" y="76.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">MachineDeployment</text><text x="360" y="98.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">ng-app 的 replicas</text><rect x="530" y="54" width="170" height="64" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="615" y="76.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">cluster-autoscaler</text><text x="615" y="98.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">看 pending pod</text><line x1="202" y1="86" x2="273" y2="86" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="237" y="72.0" font-size="12" text-anchor="middle" dominant