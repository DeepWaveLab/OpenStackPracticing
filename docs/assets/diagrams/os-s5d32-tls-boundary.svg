<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="840" height="260" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="840" height="260" fill="#fff"/><text x="420" y="28.0" font-size="16" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">本章的 TLS 範圍</text><rect x="30.0" y="75" width="240.0" height="100" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="150.0" y="115.9" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">用戶端</text><text x="150.0" y="134.1" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">驗證 CA 與位址</text><line x1="272.0" y1="125" x2="298.0" y2="125" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="300.0" y="75" width="240.0" height="100" rx="0" fill="#d4d4d4" stroke="#f0a020" stroke-width="1.4"/><text x="420.0" y="115.9" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">HAProxy／VIP</text><text x="420.0" y="134.1" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">接收 HTTPS</text><line x1="542.0" y1="125" x2="568.0" y2="125" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="570.0" y="75" width="240.0" height="100" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="690.0" y="115.9" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">API 後端／主機 IP</text><text x="690.0" y="134.1" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="