<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="420" fill="#fff"/><text x="75" y="50.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">主機</text><rect x="150" y="20" width="380" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="340.0" y="40.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">/etc/kolla/config/magnum/kubeconfig</text><text x="340.0" y="62.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">你在步驟 1 放的檔案</text><line x1="340" y1="82" x2="340" y2="122" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="352" y="103.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">deploy 時「Copying over kubeconfig file」</text><text x="75" y="154.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">主機</text><rect x="150" y="124" width="380" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="340.0" y="144.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">/etc/kolla/magnum-conductor/kubeconfig</text><text x="340.0" y="166.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">Kolla 替 conductor 產生的設定目錄</text><line x1="340" y1="186" x2="340" y2="226" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="352" y="207.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">容器啟動時,依 config.json 複製進去</text><text x="75" y="249.55" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">magnum_conductor</text><text x="75" y="266.45" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">容器內</text><rect x="150" y="228" width="380" height="60" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="340.0" y="248.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">/var/lib/magnum/.kube/config</text><text x="340.0" y="270.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">容器裡 magnum 使用者的 ~/.kube/config</text><line x1="340" y1="290" x2="340" y2="330" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="352" y="311.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">driver 讀 ~/.kube/config,連 server 欄的位址</text><text x="75" y="353.55" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">主機上的</text><text x="75" y="370.45" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">kind</text><rect x="150" y="332" width="380" height="60" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="340.0" y="352.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">kind 的 API server</text><text x="340.0" y="374.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">https://127.0.0.1:&lt;port&gt;</text></svg>