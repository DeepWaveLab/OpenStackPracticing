          - "Day 1 · Kolla AIO core": runbook/sprint3-day1-kolla-aio-core.md
          - "Day 2 · OpenStack 資源全流程": runbook/sprint3-day2-openstack-resource-flow.md
          - "Day 3 · Cinder LVM": runbook/sprint3-day3-cinder-lvm.md
