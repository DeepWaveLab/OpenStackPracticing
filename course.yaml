# course.yaml — OpenStackPracticing 課程狀態檔
# 本站早於 course-forge 建立;此檔於 2026-07-16 補建,先登記 Sprint 5 的地雷索引。
# 早期 Sprint(0–26)的地雷尚未回填進本檔。

course:
  name: "OpenStackPracticing"
  locale: zh-TW
  repo: "DeepWaveLab/OpenStackPracticing"
  site: "https://deepwavelab.github.io/OpenStackPracticing/"

# style_approved:課程主人已於 2026-07-15 逐章審過 Day 27–30 的風格(日記腔、
# 截圖、標題格式均給過修訂意見並修畢),風格基準視為已確立。
style_approved: true

# 地雷索引:總結頁的地雷回顧表、跨章引用皆從此取材。
mines:
  - { id: d27-m1, day: 27, title: "切了 driver 沒設 [oslo_limit],整個 compute API 掛掉", anchor: "sprint5-day27-multi-tenant-governance.md#mine-1" }
