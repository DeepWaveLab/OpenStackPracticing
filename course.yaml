  - { id: d30-m4, day: 30, title: "processor 每輪睡整整一小時", anchor: "sprint5-day30-cloudkitty-rating.md#mine-4" }
  - { id: d30-m5, day: 30, title: "rating hashmap mapping create 在 2025.1 直接壞掉", anchor: "sprint5-day30-cloudkitty-rating.md#mine-5" }
  - { id: d31-m6, day: 31, title: "evacuate 失敗會留下 on_maintenance,擋掉重試", anchor: "sprint5-day31-masakari-ha.md#mine-6" }
  - { id: d31-m2, day: 31, title: "ProxySQL 的統計資料庫斷電損壞,偽裝成一整排服務故障", anchor: "sprint5-day31-masakari-ha.md#mine-2" }
  - { id: d32-m6, day: 32, title: "openrc 的 CA 要另外指定", anchor: "sprint5-day32-full-tls.md#mine-6" }
  - { id: d33-m4, day: 33, title: "metadata 的檔名有一套死規則", anchor: "sprint5-day33-keycloak-federation.md#mine-4" }
  - { id: d33-m5, day: 33, title: "CLI 的錯誤不指段,兩段鏈路要拆開手打", anchor: "sprint5-day33-keycloak-federation.md#mine-5" }
  - { id: d34-m1, day: 34, title: "kolla 不複製 api-paste.ini,deploy 全綠卻什麼都沒發生", anchor: "sprint5-day34-cadf-audit.md#mine-1" }
  - { id: d34-m2, day: 34, title: "CADF 的四要素藏在 payload 底下", anchor: "sprint5-day34-cadf-audit.md#mine-2" }
  - { id: d34-m3, day: 34, title: "稽核事件靠對的 notification driver 才進 log", anchor: "sprint5-day34-cadf-audit.md#mine-3" }
  - { id: d34-m4, day: 34, title: "改生成後的 config.json,下次 deploy 會打回原形", anchor: "sprint5-day34-cadf-audit.md#mine-4" }

