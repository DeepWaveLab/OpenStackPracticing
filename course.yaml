  - { id: d27-m3, day: 27, title: "查詢回空,而限制正在執行", anchor: "sprint5-day27-multi-tenant-governance.md#mine-3" }
  - { id: d28-m1, day: 28, title: "kolla 的 docker 沒有 iptables,-p 是死的", anchor: "sprint5-day28-ceilometer-metering.md#mine-1" }
  - { id: d28-m3, day: 28, title: "--tags ceilometer 不會回頭打開別人的通知", anchor: "sprint5-day28-ceilometer-metering.md#mine-3" }
  - { id: d28-m5, day: 28, title: "Pushgateway 永遠記得已經刪掉的機器", anchor: "sprint5-day28-ceilometer-metering.md#mine-5" }
  - { id: d28-m6, day: 28, title: "無認證、可寫的計費輸入端點(host-network Pushgateway)", anchor: "sprint5-day28-ceilometer-metering.md#mine-6" }
  - { id: d29-m1, day: 29, title: "Aodh 不讀 Keystone 服務目錄,而 kolla 不產它要的檔", anchor: "sprint5-day29-aodh-autoscaling.md#mine-1" }
